<style>
    @font-face {
        font-family: universialis;
        src: url('/Universialis.ttf');
    }
</style>
<div>
  <!-- The trigger (can be styled to look invisible or like normal text) -->
  <p onclick="document.getElementById('secret').style.display = 
    (document.getElementById('secret').style.display == 'none') ? 'block' : 'none';" 
     style="cursor: pointer; color: #666; display: inline-block;">
                  👁️‍🗨️
  </p>

  <!-- The hidden text -->
  <div id="secret" style="display: none; margin-top: 10px; color: black; font-family: universialis; font-weight: bold;">
    "I feel sympathetic for William. He deserves better."
  </div>
</div>
